[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selflistload"
version = "0.3.0"
description = "Install curated wordlists and port sets, sync their sources, and prepare Windows admin tools"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Selflists" }
]

[project.urls]
Homepage = "https://github.com/MelForze/Selflists"
Repository = "https://github.com/MelForze/Selflists"

[project.scripts]
selflistload = "selflistload:main"

[tool.setuptools]
py-modules = ["selflistload"]

[tool.setuptools.data-files]
"share/selflistload" = ["bundle.json"]
"share/selflistload/dns" = ["dns/*.txt", "dns/*.gz"]
"share/selflistload/web" = ["web/*.txt", "web/*.gz"]
"share/selflistload/api" = ["api/*.txt", "api/*.gz"]
"share/selflistload/ports" = ["ports/*.txt"]
